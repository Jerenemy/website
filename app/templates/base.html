<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ambient.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/contact.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/portfolio.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/blog.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/game.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/glightbox/glightbox.min.css') }}">
    {% block extra_head %}{% endblock %}
</head>

<!-- Full-screen WebGL Fluid Background -->
<div class="ambient-fluid-bg" data-high-fidelity="true"></div>

{% include "_nav.html" %}
{% block content %}{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/header_contrast.js') }}"></script>
<script src="{{ url_for('static', filename='js/nav.js') }}"></script>
<script src="{{ url_for('static', filename='js/base.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/glightbox/glightbox.min.js') }}"></script>
<!-- WebGL Fluid Simulation for realistic gas effect -->
<script src="https://unpkg.com/webgl-fluid"></script>
<script src="{{ url_for('static', filename='js/ambient.js') }}"></script>
{% endblock %}
</body>

</html>
