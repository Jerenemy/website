{#- Shared by the share pages (share.html) and the creator pages (creators.html). -#}
  <style>
    /* Sea-glass palette: mirrors SonarPalette in the app (Color+Extensions.swift / DESIGN.md). */
    :root {
      --bg: #0C1014;
      --card: #161B21;
      --chrome: #1F262E;
      --label: #F3F5F7;
      --text-2: #98A2AD;
      --text-3: rgba(243, 245, 247, 0.38);
      --hairline: rgba(243, 245, 247, 0.08);
      --teal: #2FCBBD;
      --love: #FF5C7A;
      --amber: #FFB347;
      --rounded: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--label); }
    body {
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .glow {
      position: fixed; inset: 0 0 auto 0; height: 70vh; z-index: 0; pointer-events: none;
      background: radial-gradient(120% 80% at 50% 0%, rgba(47, 203, 189, 0.12), transparent 70%);
    }
    main {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px; margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 20px 24px;
      flex: 1;
      display: flex; flex-direction: column;
    }
    a { color: inherit; }

    /* The wordmark: the ping mark, then lowercase "sonar" with a teal full stop. */
    .brand {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--label); text-decoration: none; align-self: flex-start;
      font: 600 20px/1 var(--rounded);
    }
    .brand svg { width: 19px; height: 19px; display: block; }
    .brand b { font-weight: inherit; color: var(--teal); }

    .card { margin-top: 28px; }
    .art {
      width: min(240px, 64vw); height: auto; aspect-ratio: 1; border-radius: 16px; object-fit: cover; display: block;
      background: var(--card);
      box-shadow: 0 24px 60px -18px rgba(0, 0, 0, 0.8), 0 0 0 0.5px var(--hairline);
    }
    .art--small { width: 132px; border-radius: 14px; }
    .eyebrow { margin: 22px 0 4px; color: var(--text-2); font-size: 15px; }
    h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
    .meta { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--text-2); font-size: 15px; }
    .meta strong { color: var(--label); font-weight: 600; font-variant-numeric: tabular-nums; }
    .dots { display: inline-flex; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(243, 245, 247, 0.16); overflow: hidden; position: relative; }
    .dot > i { position: absolute; inset: 0 auto 0 0; background: var(--teal); }
    .heart { width: 15px; height: 15px; color: var(--love); display: block; }
    blockquote {
      margin: 18px 0 0; padding: 0; font-size: 19px; line-height: 1.5; color: rgba(243, 245, 247, 0.92);
      white-space: pre-line; overflow-wrap: anywhere;
    }
    .byline { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: var(--text-2); font-size: 15px; }
    .byline--top { margin: 0 0 8px; }
    .avatar {
      flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--a1, #4d7a74), var(--a2, #2b4743));
      box-shadow: inset 0 0 0 0.5px var(--hairline);
      color: rgba(243, 245, 247, 0.95); font: 600 14px/1 var(--rounded);
    }
    .avatar--small { width: 24px; height: 24px; font-size: 11px; }
    .avatar--large { width: 96px; height: 96px; font-size: 40px; margin: 8px auto 0; }
    .byline strong { color: var(--label); font-weight: 600; }
    .center { text-align: center; }

    /* Badges: an amber glyph (amber means achievement), never a checkmark or a pill. */
    .badge-glyph { width: 1em; height: 1em; flex: none; fill: currentColor; color: var(--amber); }
    .name-badge { display: inline-block; margin-left: 0.3em; line-height: 1; }
    .name-badge .badge-glyph { width: 0.8em; height: 0.8em; vertical-align: -0.04em; }
    .badges {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px;
      margin: 8px 0 0; padding: 0; list-style: none;
      color: var(--text-2); font-size: 14px; font-weight: 500;
    }
    .badges li { display: inline-flex; align-items: center; gap: 5px; }
    .badges a { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; padding: 2px 0; }
    .badges a:hover span { text-decoration: underline; text-underline-offset: 2px; }
    .badges strong { color: var(--label); font-weight: 600; }
    .badges--shows { flex-direction: column; align-items: center; gap: 2px; margin-top: 4px; }
    .center .eyebrow { margin-top: 10px; }
    .description { margin-top: 14px; color: var(--text-2); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

    /* List entries: artwork, title, show, note. No boxes; content sits on the canvas. */
    .count { margin: 12px 0 0; color: var(--text-2); font-size: 15px; }
    .items { list-style: none; margin: 22px 0 0; padding: 0; border-top: 0.5px solid var(--hairline); }
    .items li { border-bottom: 0.5px solid var(--hairline); }
    .item { display: flex; gap: 14px; align-items: center; padding: 12px 0; text-decoration: none; }
    .item img, .item .ph {
      flex: none; width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--card);
      box-shadow: 0 0 0 0.5px var(--hairline);
    }
    .item__text { min-width: 0; display: flex; flex-direction: column; }
    .item__title { font-size: 16px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item__sub { font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item__note { font-size: 14px; color: var(--text-3); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .more { margin: 14px 0 0; color: var(--text-2); font-size: 15px; }

    .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .avatar--photo { background: var(--card); overflow: hidden; }

    /* Profile and invite sections. */
    .stats { display: flex; justify-content: center; gap: 28px; margin: 18px 0 0; padding: 0; list-style: none; }
    .stats li { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
    .stats strong { font: 700 20px/1.2 var(--rounded); font-variant-numeric: tabular-nums; }
    .stats span { color: var(--text-2); font-size: 13px; }
    .section { margin-top: 34px; }
    .section h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
    .favorites { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0; padding: 0; list-style: none; }
    .favorites a { display: block; text-decoration: none; }
    .favorites img, .favorites .ph {
      width: 100%; aspect-ratio: 1; height: auto; border-radius: 10px; object-fit: cover; display: block;
      background: var(--card); box-shadow: 0 0 0 0.5px var(--hairline);
    }
    .favorites span { display: block; margin-top: 6px; font-size: 12px; line-height: 1.3; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .reviews { list-style: none; margin: 0; padding: 0; border-top: 0.5px solid var(--hairline); }
    .reviews li { border-bottom: 0.5px solid var(--hairline); }
    .rv { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; text-decoration: none; }
    .rv > img, .rv > .ph {
      flex: none; width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--card);
      box-shadow: 0 0 0 0.5px var(--hairline);
    }
    .rv .avatar { margin-top: 2px; }
    .rv__text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .rv__title { font-size: 16px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rv__sub { font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rv__body { font-size: 15px; line-height: 1.45; color: rgba(243, 245, 247, 0.86); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .rv .dots { gap: 3px; margin-top: 2px; }
    .rv .dot { width: 9px; height: 9px; }
    .rv__meta { display: flex; align-items: center; gap: 8px; }
    .rv__meta .heart { width: 12px; height: 12px; }
    .social { display: flex; gap: 16px; margin-top: 16px; color: var(--text-2); font-size: 14px; }
    .social strong { color: var(--label); font-weight: 600; font-variant-numeric: tabular-nums; }
    .lists { list-style: none; margin: 0; padding: 0; border-top: 0.5px solid var(--hairline); }
    .lists li { border-bottom: 0.5px solid var(--hairline); }
    .lists a { display: flex; justify-content: space-between; gap: 12px; padding: 13px 0; text-decoration: none; font-weight: 600; }
    .lists a span:last-child { flex: none; color: var(--text-2); font-weight: 400; font-size: 15px; }
    .invite-head { text-align: center; }
    .invite-head h1 { margin-top: 18px; }
    .invite-head .lede { margin: 8px 0 0; color: var(--teal); font: 600 20px/1.3 var(--rounded); }
    .pitch { margin: 18px 0 0; padding: 0; list-style: none; color: var(--text-2); font-size: 15px; display: grid; gap: 8px; }
    .pitch li { display: flex; gap: 10px; align-items: baseline; }
    .pitch li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); transform: translateY(-2px); }

    .actions { margin-top: auto; padding-top: 32px; display: grid; gap: 10px; }
    .button {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; border-radius: 999px; text-decoration: none;
      font-weight: 600; font-size: 17px; transition: transform .15s ease, opacity .15s ease;
    }
    .button:active { transform: scale(0.97); opacity: .85; }
    .button--primary { background: var(--teal); color: #000; }
    .button--secondary { background: var(--chrome); color: var(--label); }
    .copy-note { margin: -2px 0 4px; text-align: center; color: var(--text-2); font-size: 13px; line-height: 1.4; text-wrap: balance; }
    footer { margin-top: 20px; text-align: center; color: var(--text-3); font-size: 13px; }
    footer a { color: var(--text-2); text-decoration: none; }
    @media (min-width: 720px) { main { padding-top: 64px; } }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }

    /* Recap: a "wrapped"-style month or year. */
    .recap__who { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 15px; }
    .recap__who strong { color: var(--label); font-weight: 600; }
    .recap__who .name-badge { margin-right: 0.12em; }  /* a hair clear of the "'s" after it */
    .recap__period { margin: 18px 0 0; font: 800 clamp(44px, 14vw, 64px)/1 var(--rounded); letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .recap__lede { margin: 6px 0 0; color: var(--teal); font: 600 22px/1.2 var(--rounded); }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 26px 0 0; padding: 0; list-style: none; }
    .tile {
      display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-height: 96px; padding: 14px 16px;
      border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 0.5px var(--hairline);
    }
    .tile strong { font: 700 34px/1.05 var(--rounded); font-variant-numeric: tabular-nums; }
    .tile span { color: var(--text-2); font-size: 14px; }
    .tile .dots { margin-top: 6px; }
    .tile--hero {
      grid-column: 1 / -1; min-height: 132px;
      background: linear-gradient(135deg, rgba(47, 203, 189, 0.28), rgba(47, 203, 189, 0.06) 70%), var(--card);
    }
    .tile--hero strong { font-size: 60px; color: var(--label); }
    .tile--hero span { color: var(--label); opacity: .8; font-size: 16px; }
    .ranks { list-style: none; margin: 0; padding: 0; counter-reset: rank; border-top: 0.5px solid var(--hairline); }
    .ranks li { counter-increment: rank; border-bottom: 0.5px solid var(--hairline); }
    .ranks a { display: flex; align-items: center; gap: 14px; padding: 10px 0; text-decoration: none; }
    .ranks a::before { content: counter(rank); flex: none; width: 18px; color: var(--teal); font: 700 17px/1 var(--rounded); text-align: center; }
    .ranks img, .ranks .ph { flex: none; width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--card); box-shadow: 0 0 0 0.5px var(--hairline); }
    .best { display: flex; gap: 16px; align-items: flex-start; padding: 16px; border-radius: 18px; background: var(--card); text-decoration: none; box-shadow: inset 0 0 0 0.5px var(--hairline); }
    .best > img, .best > .ph { flex: none; width: 88px; height: 88px; border-radius: 10px; object-fit: cover; background: var(--chrome); }
    .empty-note { margin: 26px 0 0; padding: 22px 18px; border-radius: 18px; background: var(--card); color: var(--text-2); font-size: 16px; text-align: center; }
    .empty-note strong { display: block; margin-bottom: 4px; color: var(--label); font: 700 20px/1.3 var(--rounded); }
  </style>
