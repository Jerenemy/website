name: Deploy

# Every push to main runs bin/deploy from the private Jerenemy/server repo on the server: it
# fast-forwards this checkout, restarts what changed and rolls back if /health stops answering.
# What the admin pages write (portfolio.json, site_settings.json, résumé PDFs) is untracked, so
# pulls never meet it.
# The tests run first, on pull requests too, and a failure stops the deploy. pyproject.toml stays
# per machine, so the job installs what the site imports by name, without the ML packages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the site imports
        run: pip install flask flask-mail markdown pillow python-dotenv requests
      - name: Run the tests
        run: python -m unittest discover -s tests

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: ~/server/bin/deploy website
