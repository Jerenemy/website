name: Deploy

# Every push to main fast-forwards the server's checkout and restarts the supervisor programs
# whose code changed. The server keeps local edits made through the admin pages (theme.css,
# portfolio.json, résumé PDFs); --ff-only stops the deploy, untouched, if a pull would clash.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            cd /home/jzay/personal_website
            OLD=$(git rev-parse HEAD)
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            NEW=$(git rev-parse HEAD)
            CHANGED=$(git diff --name-only "$OLD" "$NEW")
            echo "Deployed $OLD -> $NEW"
            echo "$CHANGED"

            # The site restarts on every deploy (or a manual run); the two side services only
            # when their own folder changed AND they are already running. `restart` starts a
            # stopped program, and ear_service is stopped on purpose (it runs the server out of
            # memory), so a deploy must never bring it back.
            # status exits 3 when any program is down: capture it, report only.
            STATUS=$(sudo supervisorctl status || true)
            sudo supervisorctl restart personal_website
            for SVC in ear_service attack_target_network; do
              DIR=projects/${SVC%_service}/
              if echo "$CHANGED" | grep -q "^$DIR"; then
                if echo "$STATUS" | grep -qE "^$SVC +RUNNING"; then
                  sudo supervisorctl restart "$SVC"
                else
                  echo "$SVC changed but is not running: left stopped"
                fi
              fi
            done
            sudo supervisorctl status || true
