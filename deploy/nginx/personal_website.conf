# Cache-Control for /static/, chosen by URI without touching the location blocks below: the
# homepage's three.js bundle is versioned by its folder (three-r186), so it is cached for a
# year and never revalidated; everything else under /static/ (the homepage's own modules and
# stylesheets, which change in place on deploy) is cached for five minutes, then revalidated.
# An empty value adds no header, so nothing proxied to Gunicorn, /ear/ or /deltalab/ gets one.
# ($request_uri, not $uri: /ear/'s rewrite cannot make a proxied URI look like /static/.)
map $request_uri $jz_static_cache_control {
    default                                  "";
    ~^/static/home/vendor/three-r186/        "public, max-age=31536000, immutable";
    ~^/static/                               "public, max-age=300";
}

# --- Redirect all HTTP to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name jeremyzay.com www.jeremyzay.com;

    return 301 https://$host$request_uri;
}

# --- Main HTTPS site ---
server {
    # http2 (nginx 1.24 syntax: a listen parameter): the homepage loads some 30 files, which
    # HTTP/1.1 would queue six at a time.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jeremyzay.com www.jeremyzay.com;

    # max file upload limit
    client_max_body_size 10m;

    # Compression: text/html is always on the list; the homepage's modules, stylesheets, the
    # 700 KB three.js bundle and JSON answers are text too. Vary keeps caches honest.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Inherited by every location below (none sets add_header of its own); see the map above.
    add_header Cache-Control $jz_static_cache_control;

    # SSL (Certbot-managed)
    ssl_certificate /etc/letsencrypt/live/jeremyzay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeremyzay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static files
    location /static/ {
        alias /home/jzay/personal_website/app/static/;
    }

    # Flask (Gunicorn) reverse proxy
    location / {
        proxy_pass http://localhost:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    # --- 2. Ear Service (Port 5001) ---

    # Force trailing slash (jeremyzay.com/ear -> jeremyzay.com/ear/)
    # This ensures relative Javascript calls work correctly
    location = /ear {
        return 301 $scheme://$http_host/ear/;
    }

    location /ear/ {
        # INCREASE UPLOAD SIZE HERE
        client_max_body_size 50M;
        # Strip '/ear/' from the URL so Flask sees just '/' or '/query'
        rewrite ^/ear/(.*) /$1 break;

        proxy_pass http://127.0.0.1:5001;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for ML inference
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # --- 3. DeltaLab Dash Service (Port 5002) ---

    # Force trailing slash (jeremyzay.com/deltalab -> jeremyzay.com/deltalab/)
    location = /deltalab {
        return 301 $scheme://$http_host/deltalab/;
    }

    location /deltalab/ {
        proxy_pass http://127.0.0.1:5002;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for Dash callbacks
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
