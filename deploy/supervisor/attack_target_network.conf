[program:attack_target_network]
directory=/home/jzay/personal_website/projects/attack_target_network
command=/home/jzay/personal_website/.venv/bin/gunicorn "week_3_attack_target_graph_dash:server" --bind 127.0.0.1:5002 --workers 1 --timeout 120 --preload
environment=DELTA_BASE_PATH="/deltalab/"
# Optional: if CSVs live outside default paths, set DELTA_DATA_ROOT.
# Example:
# environment=DELTA_BASE_PATH="/deltalab/",DELTA_DATA_ROOT="/home/jzay/personal_website/projects/attack_target_network/data_inputs"
user=jzay
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/personal_website/attack_target_network.err.log
stdout_logfile=/var/log/personal_website/attack_target_network.out.log
